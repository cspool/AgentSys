[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsys-sim"
version = "0.1.0"
description = "Trace-driven Agentix/Agent.xpu/ATX/TISA full-stack simulator"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
agentsys-reproduce = "agentsys.experiments:main"
agentsys-reproduce-all = "agentsys.reproduce:main"
agentsys-paper-reproduce = "agentsys.paper_reproduction:main"
agentsys-toolchain = "agentsys.toolchain:main"
agentsys-reproduce-revised = "agentsys.revised_reproduce:main"
agentsys-run-workload = "agentsys.workload_pipeline:main"
agentsys-layer-regression = "agentsys.layer_regression:main"
agentsys-reproduce-parameterized = "agentsys.parameterized_reproduce:main"
agentsys-certificate-parameterized = "agentsys.parameterized_certificate:main"
agentsys-gpu-runtime = "agentsys.gpu_runtime:main"
agentsys-gpu-runtime-audit = "agentsys.gpu_runtime_audit:main"
agentsys-mllm-cuda-audit = "agentsys.mllm_cuda_audit:main"
agentsys-run-hybrid = "agentsys.hybrid_system:main"
agentsys-hybrid-runtime = "agentsys.hybrid_runtime:main"
agentsys-reproduce-hybrid = "agentsys.hybrid_reproduce:main"
agentsys-hybrid-profile-audit = "agentsys.hybrid_profile_audit:main"
agentsys-certificate-hybrid = "agentsys.hybrid_certificate:main"
agentsys-mlx-reference-audit = "agentsys.mlx_reference:main"
agentsys-mlx-standalone = "agentsys.mlx_standalone:main"
agentsys-mlx-chipyard = "agentsys.mlx_chipyard:main"
agentsys-run-mlx-agent = "agentsys.mlx_agent_system:main"
agentsys-reproduce-mlx-agent = "agentsys.mlx_agent_reproduce:main"
agentsys-mlx-layer-regression = "agentsys.mlx_layer_regression:main"
agentsys-reproduce-mlx-complete = "agentsys.mlx_complete_reproduce:main"
agentsys-certificate-mlx = "agentsys.mlx_certificate:main"

[dependency-groups]
dev = [
  "cmake==3.31.10",
  "hypothesis==6.131.0",
  "ninja==1.13.0",
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
