[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsys-sim"
version = "0.1.0"
description = "Trace-driven Agentix/Agent.xpu/ATX/TISA full-stack simulator"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentsys-reproduce = "agentsys.experiments:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

