# Research State — Central Project Tracking
project:
  title: "AgentSys: dynamic-agent full-stack scheduling from program DAG to NPU tile"
  question: "Can Agentix, Agent.xpu, mllm/llm.npu, TISA and HPTPE be independently reproduced within 15%, then compose on an ordinary-RISC-V Chipyard CPU+XPU system?"
  status: active
  started: "2026-08-25"
  domain: "computer systems and architecture"

literature:
  key_papers:
    - id: agentix2026
      title: "Agentix: An Efficient Serving Engine for LLM Agents as General Programs"
      authors: "Luo et al."
      year: 2026
      relevance: "PLAS/ATLAS program-aware scheduling and locality-aware routing"
    - id: agentxpu2025
      title: "Agent.xpu: Efficient Scheduling of Agentic LLM Workloads on Heterogeneous SoC"
      authors: "Wei et al."
      year: 2025
      relevance: "HEG, stage elasticity, adaptive batching, and fine-grained preemption"
    - id: atx2026
      title: "ATX: Accelerator Task Extensions"
      authors: "Gerogiannis et al."
      year: 2026
      relevance: "Near-core asynchronous speculative tasks and UTE prefetching"
    - id: tisa2026
      title: "Dynamic Scheduling for AI Accelerators via TISA"
      authors: "Song et al."
      year: 2026
      relevance: "Semantic tile ISA and dynamic ME/VE/DE scheduling"
  open_problems:
    - "No source paper evaluates program-to-tile priority propagation as one stack."
    - "Agentix requires multi-A100 hardware and TISA uses unreleased commercial silicon/RTL."
  evidence_gaps:
    - "No public TISA RTL or exact Epoch hardware simulator."
    - "No local multi-A100 platform; Agentix performance must remain trace-simulation evidence."
    - "Agent.xpu paper testbed is Intel Core Ultra 5 125H, not the available x86/Chipyard system."
    - "llm.npu uses proprietary Qualcomm QNN on Xiaomi/Redmi devices; local evidence must remain source-grounded simulation plus real mllm framework execution."
    - "HPTPE includes author-generated Synopsys DC reports and a SAED32 library, but a fresh licensed DC run is unavailable."

hypotheses:
  - id: H1
    statement: "PLAS/ATLAS lowers cumulative wait and DAG makespan versus FCFS/MLFQ because attained service approximates remaining program length and critical-path progress."
    status: supported
    motivation: "Reproduce Agentix's core scheduling mechanism before composing lower layers."
    parent: null
    priority: high
  - id: H2
    statement: "HEG stage elasticity plus reactive-first batching and tile-boundary preemption jointly preserve proactive throughput while reducing reactive tail latency."
    status: supported
    motivation: "Reproduce Agent.xpu's core heterogeneous scheduling mechanism."
    parent: null
    priority: high
  - id: H3
    statement: "ATX prefetch/double buffering and TISA semantic out-of-order issue expose independent memory and ME/VE/DE overlap gains."
    status: supported
    motivation: "Reproduce the core hardware scheduling mechanisms in an executable simulator and Chipyard RTL."
    parent: null
    priority: high
  - id: H4
    statement: "Propagating program priority through flow, task, tile, and engine arbitration composes the three layers without priority inversion and yields an end-to-end gain beyond any single layer."
    status: supported
    motivation: "Test the new full-stack contribution; no paper target will be used for this result."
    parent: null
    priority: high
  - id: H5
    statement: "Native mllm MIR operator traces can lower deterministically into the shared AgentSys ME/VE/DE simulator contract without losing SSA dependencies."
    status: supported
    motivation: "Close the model-operator trace/simulator-backend implementation requirement."
    parent: null
    priority: high
  - id: H6
    statement: "A real Ramulator2 DDR trace can drive the NPU data-engine latency model and expose memory-to-ME bottleneck shifting."
    status: supported
    motivation: "Close the Ramulator2 DDR implementation and bandwidth-ablation requirement."
    parent: null
    priority: high
  - id: H7
    statement: "Cross-layer gains have identifiable knees and bottleneck shifts rather than scaling monotonically with every resource."
    status: supported
    motivation: "Complete the requested priority, preemption, prefetch, window, dataflow, and bandwidth ablations."
    parent: null
    priority: medium
  - id: H9
    statement: "A pinned, machine-audited toolchain can rebuild the required backends and replay all paper/system experiments strictly serially without changing registered results."
    status: supported
    motivation: "Close the expanded complete-toolchain and configuration requirement."
    parent: null
    priority: high
  - id: H10
    statement: "Independent Agentix, Agent.xpu, ATX and TISA profiles all remain within a strict 10% endpoint error gate without mechanism retuning."
    status: supported
    motivation: "Close the tightened per-paper implementation, toolchain and performance requirement."
    parent: null
    priority: high
  - id: H11
    statement: "Unavailable Agentix A100/vLLM and ATX private-Sniper mechanisms can be replaced by open executable simulators while all registered endpoints remain within 10%."
    status: supported
    motivation: "Replace parameterized component closure with self-implemented closed-platform mechanisms."
    parent: null
    priority: high
  - id: H12
    statement: "An executed Agent application and native model trace can compile into RISC-V software, run on Rocket CPU+XPU, and preserve useful cross-layer performance evidence."
    status: supported
    motivation: "Close the application-framework-software-hardware system integration requirement."
    parent: null
    priority: high
  - id: H13
    statement: "Independently reproduced mllm, Agent.xpu and HPTPE components can integrate through TISA into an ordinary-RISC-V CPU+XPU system without losing their paper-level performance behavior."
    status: pending
    motivation: "Implement the revised final architecture without ATX in the CPU path."
    parent: null
    priority: high

