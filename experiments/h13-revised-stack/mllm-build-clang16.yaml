Tasks:
  - CMakeConfigTask:
      cmake_cfg_path: "build-clang16"
      cmake_build_type: "Release"
      cmake_extra_args:
        - "-DHWY_ENABLE_TESTS=OFF"
        - "-DHWY_ENABLE_EXAMPLES=OFF"
        - "-DHWY_ENABLE_CONTRIB=OFF"
        - '-DMLLM_CPU_BACKEND_COMPILE_OPTIONS="-march=native"'
        - "-DMLLM_KERNEL_USE_THREADS=OFF"
        - "-DMLLM_KERNEL_THREADS_VENDOR_OPENMP=OFF"
        - "-DMLLM_KERNEL_USE_THREADS_VENDOR_MLLM=OFF"
        - "-DMLLM_ENABLE_TEST=ON"
        - "-DMLLM_ENABLE_BENCHMARK=ON"
        - "-DMLLM_ENABLE_EXAMPLE=OFF"
        - "-DMLLM_ENABLE_TOOLS=ON"
        - "-DMLLM_BUILD_SDK_C_BINDING=OFF"
        - "-DMLLM_BUILD_EXT_OP_SET=OFF"
        - "-DCMAKE_CXX_STANDARD_LIBRARIES=-ldl"

  - CMakeBuildTask:
      cmake_cfg_path: "build-clang16"
